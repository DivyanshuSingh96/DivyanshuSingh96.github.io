machyon:
  kicker: Flagship · open source
  name: Machyon
  description: >-
    A Python library that downloads images from URL lists and accounts for every row: downloaded, already on disk,
    or failed with a reason. It measures before it adds connections, respects servers that ask it to slow down, and
    resumes exactly where it stopped.
  tagline: Every image. Mach speed. Zero lost.
  commands: ["pip install machyon", "machyon ui"]
  version: "1.2.3"
  links:
    - { label: Documentation, url: "https://divyanshusingh96.github.io/machyon/" }
    - { label: The 104-second film, url: "https://divyanshusingh96.github.io/machyon/project/film/" }
    - { label: GitHub, url: "https://github.com/DivyanshuSingh96/machyon" }
    - { label: PyPI, url: "https://pypi.org/project/machyon/" }

