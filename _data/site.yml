name: Divyanshu Singh
url: https://divyanshusingh96.github.io/

seo:
  title: "Divyanshu Singh: builder, researcher and dataset publisher"
  description: >-
    Divyanshu Singh builds open-source software and publishes open datasets, including Machyon, a Python library
    that downloads images from URL lists and accounts for every row.

hero:
  roles: [Builder, Researcher, Dataset publisher, Game developer]
  headline: I build tools that leave nothing unaccounted for.
  intro: >-
    Open-source software, research and datasets, made one careful step at a time. From my first lines of code on
    Sololearn in 2019 to Machyon today.
  # 創る (tsukuru, to create) beside the hero is drawn as a graphic in index.html
  motto_ja: ひとつずつ、丁寧に。
  motto_en: One at a time, with care.

